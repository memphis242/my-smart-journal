# Quality gates for the backend and the web client. Every job runs the same commands as a
# local `scripts/check.sh` (selected with --only), needs no secrets, and never reaches an
# inference provider: tests reject real HTTP except loopback in integration tests, and every
# task uses the deterministic fake provider.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON: python3.14
  PYTHONDONTWRITEBYTECODE: "1"
  HYPOTHESIS_PROFILE: ci
  FORCE_COLOR: "1"

jobs:
  backend-static:
    name: Backend lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - &build-dir
        name: Use a build directory outside the checkout
        run: echo "MSJ_BUILD_DIR=${RUNNER_TEMP}/build" >> "${GITHUB_ENV}"
      - &pip-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/build/pip-cache
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements/dev.txt') }}
      - run: scripts/check.sh --setup --only ruff,format,mypy,basedpyright,deptry,lock,scripts

  backend-tests:
    name: Backend tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - *setup-python
      - *build-dir
      - *pip-cache
      - run: scripts/check.sh --setup --only tests
      - name: Upload test log and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-tests
          path: |
            ${{ runner.temp }}/build/check-logs/tests.log
            ${{ runner.temp }}/build/coverage/unit/coverage.xml
          if-no-files-found: ignore

  backend-integration:
    name: Backend process-level integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - *setup-python
      - *build-dir
      - *pip-cache
      - run: scripts/check.sh --setup --only integration
      - name: Upload integration log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-integration
          path: ${{ runner.temp }}/build/check-logs/integration.log

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - *setup-python
      - *build-dir
      - *pip-cache
      - &setup-pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - &setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: scripts/check.sh --setup --only audit,web-audit

  web:
    name: Web typecheck, lint, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - *build-dir
      - *setup-pnpm
      - *setup-node
      - run: scripts/check.sh --only web-typecheck,web-lint,web-test,web-build

  web-e2e:
    name: Web end-to-end (mock API)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *build-dir
      - *setup-pnpm
      - *setup-node
      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - run: scripts/check.sh --only web-e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ${{ runner.temp }}/build/check-logs/web-e2e.log
            ${{ runner.temp }}/build/web/playwright-report
            ${{ runner.temp }}/build/web/test-results
          if-no-files-found: ignore
