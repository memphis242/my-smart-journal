[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-smart-journal"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic>=2", "pydantic-settings", "httpx", "rapidfuzz", "jsonschema", "python-multipart", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "pytest-asyncio", "ruff", "mypy", "types-jsonschema"]
semantic = ["sentence-transformers"]

[project.scripts]
msj = "msj.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/msj"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
