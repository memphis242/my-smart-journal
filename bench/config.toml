[runpod]
api_base = "https://api.runpod.ai/v2"
gpu_hourly_usd = 0.58
# Cold LLM starts download weights; allow time for both queueing and execution.
timeout_s = 900.0
request_timeout_s = 30.0
poll_initial_s = 1.0
poll_max_s = 10.0
backoff = 1.5

[stt]
endpoint_name = "msj-bench-whisper"
endpoint_id = "b92qs7e2v6wi3n"
model = "turbo"

[llm]
endpoint_name = "msj-bench-llm"
endpoint_id = "rcybvy10rvnu2q"
model = "any"
max_tokens = 1024

[openai]
base_url = "http://127.0.0.1:8080/v1"
model = "local"
timeout_s = 300.0

[output]
out_dir = "/workspace/build/my-smart-journal-phase0/results"

# Informational inventory only. The harness never deploys or swaps models.
# Repository file listings: https://huggingface.co/<hf_repo>/tree/main
