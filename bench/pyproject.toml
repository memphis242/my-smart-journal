[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "msj-bench"
version = "0.1.0"
description = "Offline-testable journaling STT and LLM benchmark harness"
requires-python = ">=3.14"
dependencies = ["httpx==0.28.1", "jiwer==4.0.0", "jsonschema==4.25.1", "python-dotenv==1.2.1"]

[project.scripts]
msj-bench = "msj_bench.run:main"

[tool.hatch.build.targets.wheel]
packages = ["msj_bench"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "msj_bench/resources/prompts"
"schemas" = "msj_bench/resources/schemas"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
tmp_path_retention_policy = "failed"
